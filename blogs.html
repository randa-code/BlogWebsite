{% extends 'blog/master.html' %}

{% block content %}
<h2>All Blog Posts</h2>
<p>Click on any title below to read full details and views:</p>
<ul>
    {% for post in posts %}
    <li>
        <a href="{% url 'blog_details' post.id %}" style="font-size: 1.1em; color: blue;">
            {{ post.title }}
        </a>
        <span> - {{ post.date_published }}</span>
    </li>
    {% empty %}
    <li>No blogs published yet.</li>
    {% endfor %}
</ul>
{% endblock %}
